[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telugubridge-ai"
version = "0.1.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["../requirements.txt"]}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]

